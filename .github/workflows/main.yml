name: Node CI
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - '*'
    workflow_dispatch:
permissions:
    contents: read
jobs:
    build:
        strategy:
            matrix:
                platform: [ubuntu-latest]
                node-version: [24.15.0]
        runs-on: ${{ matrix.platform }}
        env:
            PUPPETEER_SKIP_DOWNLOAD: true
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.26.0
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'pnpm'
                  cache-dependency-path: 'pnpm-lock.yaml'
            - run: pnpm install
            - run: pnpm lint
            - run: pnpm build
              env:
                  NODE_OPTIONS: '--max_old_space_size=4096'
            - run: pnpm test:coverage
            - name: Cypress install
              run: pnpm cypress install
            - name: Install dependencies (Cypress Action)
              uses: cypress-io/github-action@v7.1.5
              with:
                  working-directory: ./
                  runTests: false
            # The action's own `start` + `wait-on` gives up on the first refused connection
            # ("Socket closed before the connection was established") instead of retrying, on
            # localhost and on 127.0.0.1 alike. The server is started and awaited here instead.
            - name: Start the server
              working-directory: packages/server
              run: |
                  nohup pnpm start > "$RUNNER_TEMP/flowise-server.log" 2>&1 &
                  for attempt in $(seq 1 60); do
                      if curl --silent --fail --output /dev/null http://localhost:3000; then
                          echo "server up after $attempt attempt(s)"
                          exit 0
                      fi
                      sleep 2
                  done
                  echo "server did not answer on http://localhost:3000 within 120 s" >&2
                  tail -n 100 "$RUNNER_TEMP/flowise-server.log" >&2
                  exit 1
            - name: Cypress test
              uses: cypress-io/github-action@v7.1.5
              with:
                  install: false
                  working-directory: packages/server
                  browser: chrome
